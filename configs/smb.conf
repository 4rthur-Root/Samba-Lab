[global]
   workgroup = WORKGROUP
   server string = Samba Server
   netbios name = SAMBA

   # Security
   security = user
   map to guest = never
   restrict anonymous = 2

   # Protocols
   min protocol = SMB2
   max protocol = SMB3

   # SMB3 encryption required
   smb encrypt = required

   # Logging
   log file = /var/log/samba/log.%m
   max log size = 1000
   log level = 2  auth_json_audit:3

   # Performance
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072

[direction]
   path = /srv/samba/direction
   valid users = @direction
   read only = no
   create mask = 0660
   directory mask = 2770
   force group = direction

[comptabilite]
   path = /srv/samba/comptabilite
   valid users = @comptabilite
   read only = no
   create mask = 0660
   directory mask = 2770
   force group = comptabilite

[rh]
   path = /srv/samba/rh
   valid users = @rh
   read only = no
   create mask = 0660
   directory mask = 2770
   force group = rh

[technique]
   path = /srv/samba/technique
   valid users = @technique
   read only = no
   create mask = 0660
   directory mask = 2770
   force group = technique

[commun]
   path = /srv/samba/commun
   valid users = @direction @comptabilite @rh @technique
   read only = no
   create mask = 0664
   directory mask = 2777
